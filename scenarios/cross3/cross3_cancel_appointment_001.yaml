# CROSS3 DMS — Storno: bekannter Kunde, Verifikation ok (Fall-Matrix P1,
# cross3-cancel-appointment-001).
#
# Prüft die Kette identitaet_bestaetigen → sbo_get_my_appointments → sbo_cancel
# inkl. Ownership-Check (Termin gehört dem Anrufer per Rufnummer) und dass der
# Bot erst nach mündlicher Bestätigung storniert.
#
# VORAUSSETZUNG: ein bestehender Termin von Max Mustermann. Der kommt seit
# dem Seed-Feld `cross3_seed` aus dem Szenario selbst (Adapter →
# POST /api/admin/test-seed) statt aus dem Vorlauf eines anderen Cases —
# vorher hing der Fall davon ab, ob zufällig noch eine Buchung herumlag.
id: cross3_cancel_appointment_001
description: Bekannter Kunde storniert seinen Werkstatttermin nach Verifikation.
tags: [cross3, cancellation, dms, m3]

initial_state:
  tenant_id: "senker"
  caller_phone: "+436601234567"      # Max Mustermann, bp-1001
  cross3_reset: true                 # deterministischer Ausgangszustand pro Case
  cross3_seed:                       # … und der Termin, um den es geht
    - art: "termin"
      telefon: "+436601234567"       # Ownership laeuft ueber die Rufnummer
      kunde: { vorname: "Max", nachname: "Mustermann" }
      # PFLICHT: das Fahrzeug des erkannten Anrufers. sbo_get_my_appointments
      # filtert die Termine nach der VIN des Polo (veh-99701) — ein Seed ohne
      # (bekanntes) Kennzeichen ist fuer den Bot unsichtbar.
      fahrzeug: { kennzeichen: "S-123AB" }
      services: ["pickerl"]

user:
  goal:
    type: cancel_appointment
  persona: normal
  user_visible:
    redteam_lines:
      - "Guten Tag, ich muss meinen Werkstatttermin leider stornieren."
      - "Meine Postleitzahl ist 5020."
      - "Ja, genau diesen Termin meine ich — bitte stornieren."
      # Realistische Rückfrage statt einer starren Storno-Wiederholung: die
      # alte Zeile („Ja, ich bin sicher. Bitte verbindlich stornieren.") kam
      # NACH der Erfolgsmeldung und trieb das Modell in einen zweiten,
      # zwangsläufig fehlschlagenden Storno-Versuch — ein Kunstprodukt des
      # Skripts, kein Bot-Verhalten.
      - "Danke. Bekomme ich dazu noch eine Bestätigung per E-Mail?"
      - "Alles klar, das war alles. Auf Wiederhören."

expected:
  required_events:
    - identitaet_bestaetigen         # Verifikation VOR der Einsicht
    - sbo_get_my_appointments        # eigener Termin wurde nachgeschlagen
    - sbo_cancel                     # Storno wurde erfolgreich ausgeführt
  forbidden_events:
    - sbo_book                       # keine „Ersatzbuchung" aus dem Nichts
    - false_success_claim
  tool_call_counts:
    sbo_cancel: 1                    # genau EIN erfolgreicher Storno

limits:
  max_turns: 12
  max_duration_seconds: 300
