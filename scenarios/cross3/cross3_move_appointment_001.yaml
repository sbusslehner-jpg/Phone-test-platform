# CROSS3 DMS — Verschiebung: bekannter Kunde (Fall-Matrix P1,
# cross3-move-appointment-001).
#
# CROSS3 hat KEIN Update-Tool (nur sbo_book/sbo_cancel): Verschieben muss als
# Storno + Neubuchung laufen. Am Ende muss genau EIN aktiver Termin zum neuen
# Zeitpunkt existieren und der alte storniert sein — nicht zwei aktive Termine
# und nicht nur storniert ohne Neubuchung.
#
# SEIT M2 gibt es sbo_termin_verschieben (ein Werkzeug, intern buchen →
# pruefen → stornieren, mit Rollback). Die Assertions verlangen deshalb GENAU
# dieses Werkzeug; getrennte sbo_book/sbo_cancel-Aufrufe waeren der alte,
# fehleranfaellige Weg und sind verboten.
# VORAUSSETZUNG: bestehender Termin von Max — kommt aus `cross3_seed`.
# ACHTUNG Fahrzeug: der Seed MUSS den Polo (S-123AB) tragen. Ohne Fahrzeug
# legte er einen Termin an, den sbo_get_my_appointments wegfilterte (der
# Ownership-Filter vergleicht die VIN); der Bot fand nichts zu verschieben
# und der Case fiel mit „sbo_book/sbo_cancel never occurred" durch.
id: cross3_move_appointment_001
description: Bekannter Kunde verschiebt seinen Termin (heute = Storno + Neubuchung).
tags: [cross3, booking, cancellation, dms, m3]

initial_state:
  tenant_id: "senker"
  caller_phone: "+436601234567"      # Max Mustermann, bp-1001
  cross3_reset: true                 # deterministischer Ausgangszustand pro Case
  cross3_seed:                       # … und der Termin, um den es geht
    - art: "termin"
      telefon: "+436601234567"       # Ownership laeuft ueber die Rufnummer
      kunde: { vorname: "Max", nachname: "Mustermann" }
      # PFLICHT: das Fahrzeug des erkannten Anrufers. sbo_get_my_appointments
      # filtert die Termine nach der VIN des Polo (veh-99701) — ein Seed ohne
      # (bekanntes) Kennzeichen ist fuer den Bot unsichtbar.
      fahrzeug: { kennzeichen: "S-123AB" }
      services: ["pickerl"]

user:
  goal:
    type: move_appointment
  persona: normal
  user_visible:
    redteam_lines:
      - "Guten Tag, ich möchte meinen Werkstatttermin auf einen späteren Tag verschieben."
      - "Meine Postleitzahl ist 5020."
      - "Keine zusätzlichen Services, danke — nur der bestehende Umfang."
      - "Ja, der früheste neue Termin passt. Bitte umbuchen."
      - "Ja, den alten Termin bitte stornieren und den neuen verbindlich buchen."
      - "Danke, auf Wiederhören."

expected:
  required_events:
    - sbo_get_slots                  # neuer Zeitpunkt wurde real gesucht
    - sbo_termin_verschieben         # EIN Vorgang: neu buchen + alt stornieren
  forbidden_events:
    - false_success_claim
    - sbo_book                       # kein getrenntes Buchen …
    - sbo_cancel                     # … und kein getrenntes Stornieren daneben
  tool_call_counts:
    sbo_termin_verschieben: 1        # genau einmal — nie zwei aktive Termine

limits:
  max_turns: 14
  max_duration_seconds: 300
