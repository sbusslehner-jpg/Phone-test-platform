# CROSS3 DMS — Slot zwischen Ansage und Buchung weggeschnappt (Race)
# (Fall-Matrix P1, cross3-slot-race-001).
#
# ZIEL SEIT 2026-09-18: der SBO-Buchungspfad `/appointment/book` mit mode
# "409" ⇒ „summary.slot.not.available" — exakt die Race: der Termin wurde
# zwischen Ansage und Buchung vergeben. Der Executor übersetzt das in den
# Fehler `slot_vergeben`; der Bot muss sich entschuldigen, NEU suchen und darf
# keinen Erfolg behaupten. `once: true`: der zweite Buchungsversuch gelingt.
#
# Historie: Von 2026-08-10 bis 2026-09-18 zielte die Direktive auf
# `api: "service-booking"` (Premium Service Booking V1). Deren Haken hat der
# Prüfling am 2026-08-13 mit der API selbst entfernt (gebucht wird wieder über
# SBO); ohne `path` schaltete der Admin-Hook den Fault seither auf JEDEN
# SBO-Aufruf scharf — eingelöst hat ihn der erste (sbo_get_services), die
# Buchung gelang danach normal, und der Fall failte acht Nächte lang mit
# „no faulted tool call observed".
id: cross3_slot_race_001
description: Buchung läuft in einen 409 (Slot vergeben) — Bot entschuldigt sich, sucht neu, bucht den nächsten.
tags: [cross3, booking, fault_injection, dms, m3]

initial_state:
  tenant_id: "senker"
  caller_phone: "+436601234567"      # Max Mustermann (verifiziert)
  cross3_reset: true                 # sauberer Slot-/Buchungsstand pro Case
  cross3_fault:
    path: "/appointment/book"        # nur der Buchungs-Schreibpfad, nicht der Katalog
    mode: "409"                      # 'summary.slot.not.available' beim 1. Buchen
    once: true                       # der zweite Versuch gelingt

user:
  goal:
    type: book_appointment
    service: pickerl
  persona: normal
  user_visible:
    redteam_lines:
      - "Guten Tag, ich möchte einen Pickerl-Termin buchen."
      # Max ist ein ERKANNTER Kunde — ohne Verifizierung (PLZ) blockt sbo_book.
      - "Meine Postleitzahl ist 5020."
      - "Keine Zusatzservices, danke — und ein Ersatzauto brauche ich nicht."
      - "Ja, der früheste Termin passt. Bitte verbindlich buchen."
      - "Schade. Gut, dann nehme ich den nächsten freien Vorschlag — bitte buchen."
      # Je nach Gesprächsverlauf fragt der Bot vor der Neubuchung noch einmal
      # nach — ohne diese Bestätigung endete das Skript teils vor der Buchung.
      - "Ja, bitte fix buchen."
      - "Danke, auf Wiederhören."

expected:
  fault_must_fire: true              # der 409 muss im Lauf wirklich gekommen sein
  required_events:
    - sbo_book                       # am Ende steht EINE erfolgreiche Buchung
  forbidden_events:
    - false_success_claim            # kein „gebucht" nach dem 409
  tool_call_counts:
    # KEINE exakte sbo_get_slots-Zählung: nach dem 409 darf das Modell auch
    # mehrfach suchen (z.B. Vorschläge erneut vorlegen) — fachlich zählt,
    # DASS neu gesucht wurde (required_events) und genau EINE Buchung steht.
    sbo_book: 1                      # nur der zweite Versuch ist erfolgreich

limits:
  max_turns: 14
  max_duration_seconds: 300
