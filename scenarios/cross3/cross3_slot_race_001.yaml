# CROSS3 DMS — Slot zwischen Ansage und Buchung weggeschnappt (Race)
# (Fall-Matrix P1, cross3-slot-race-001).
#
# SCHARF seit 2026-08-10: Der Prüfling kennt jetzt `armServiceBookingFault`
# (server/mocks/service-booking.mjs, via /api/admin/test-fault mit
# api: "service-booking" + mode). Ein mode "409" antwortet auf dem
# Buchungs-SCHREIBPFAD (`createServiceBooking`) mit
# „summary.slot.not.available" — exakt die Race: der Termin wurde zwischen
# Ansage und Buchung vergeben. Der Executor übersetzt das in den Fehler
# `slot_vergeben`; der Bot muss sich entschuldigen, NEU suchen und darf
# keinen Erfolg behaupten. `once: true`: der zweite Buchungsversuch gelingt.
#
# Historie: Nach dem API-Umbau (Buchung über Premium Service Booking statt
# SBO `/appointment/book`) war die Race nicht mehr injizierbar — der Case
# failte BEWUSST mit `fault_must_fire: true` ohne Direktive, statt vakuum-
# grün eine gewöhnliche Buchung durchzuwinken.
id: cross3_slot_race_001
description: Buchung läuft in einen 409 (Slot vergeben) — Bot entschuldigt sich, sucht neu, bucht den nächsten.
tags: [cross3, booking, fault_injection, dms, m3]

initial_state:
  tenant_id: "senker"
  caller_phone: "+436601234567"      # Max Mustermann (verifiziert)
  cross3_reset: true                 # sauberer Slot-/Buchungsstand pro Case
  cross3_fault:
    api: "service-booking"
    mode: "409"                      # 'summary.slot.not.available' beim 1. Buchen
    once: true                       # der zweite Versuch gelingt

user:
  goal:
    type: book_appointment
    service: pickerl
  persona: normal
  user_visible:
    redteam_lines:
      - "Guten Tag, ich möchte einen Pickerl-Termin buchen."
      # Max ist ein ERKANNTER Kunde — ohne Verifizierung (PLZ) blockt sbo_book.
      - "Meine Postleitzahl ist 5020."
      - "Keine Zusatzservices, danke."
      - "Ja, der früheste Termin passt. Bitte verbindlich buchen."
      - "Schade. Gut, dann nehme ich den nächsten freien Vorschlag — bitte buchen."
      - "Danke, auf Wiederhören."

expected:
  fault_must_fire: true              # der 409 muss im Lauf wirklich gekommen sein
  required_events:
    - sbo_book                       # am Ende steht EINE erfolgreiche Buchung
  forbidden_events:
    - false_success_claim            # kein „gebucht" nach dem 409
  tool_call_counts:
    sbo_get_slots: 2                 # Erst-Suche + Neu-Suche nach dem Race
    sbo_book: 1                      # nur der zweite Versuch ist erfolgreich

limits:
  max_turns: 14
  max_duration_seconds: 300
