# CROSS3 DMS — Voice: Barge-in während der Slot-Ansage (Fall-Matrix P1,
# cross3-voice-barge-in-slot-announce-001).
#
# voice_barge_in_001 testet nur den Referenz-Bot — dieser Fall fährt die ECHTE
# CROSS3-Bridge via Cross3VoicePhoneClient (Relay-Protokoll /ws/phone-media,
# SLIN 8 kHz; siehe docs/TESTING_CROSS3.md). Der Anrufer unterbricht mitten in
# der Terminvorschlags-Ansage („Nein, lieber Donnerstag"). Erwartung:
# clear-Frame ≤ 300 ms (voice:barge_in_detected + voice:barge_in_sla, beide
# kritisch), der Bot verarbeitet den Einwand und bucht den vom Kunden
# GEWÄHLTEN Slot — nicht den angesagten.
#
# Lauf: run_cross3_voice_suite (runner/cross3_voice.py) mit Cross3VoicePhoneClient;
# die DID gehört zum Tenant senker (Fixture +43720273834). Braucht ein echtes
# Azure-Realtime-Deployment + RELAY_TOKEN.
#
# Was dieser Fall NICHT prüft, und warum:
#
# Ursprünglich forderte er `required_events: [sbo_book]`. Das konnte nie
# zutreffen — der Relay leitet keine Werkzeug-Aufrufe durch, sie laufen in der
# Brücke. Der Fall war strukturell rot und sah wie ein Bot-Fehler aus.
#
# Den Bestand kann die Plattform inzwischen lesen (GET /api/admin/test-state,
# `--admin-token`), die Zusicherung „am Ende ist genau einmal gebucht" wäre also
# formulierbar. Sie steht trotzdem nicht hier: Der Anrufer ist SKRIPTET, und
# eine Buchung braucht fünf bis sieben Antworten auf Fragen, deren Reihenfolge
# das Modell von Lauf zu Lauf ändert (gemessen 2026-08-30: dreimal derselbe
# Anruf, dreimal ein anderer Fragen-Baum). Ein starrer Anrufer landet dann
# zwangsläufig neben der Frage — und der Fall wäre dauerhaft rot aus einem
# Grund, der mit dem Bot nichts zu tun hat.
#
# Geprüft wird deshalb, wofür der Fall da ist: dass die Unterbrechung binnen
# 300 ms ankommt (voice:barge_in_sla, kritisch) und dass der Bot nichts zusagt,
# was er nicht gebucht hat. Die Buchungs-Zusicherung gehört an ein Szenario mit
# einem Anrufer, der auf Fragen eingehen kann.
id: cross3_voice_barge_in_slot_announce_001
description: Barge-in in der Slot-Ansage der echten CROSS3-Bridge — clear ≤ 300 ms, gewählter Slot zählt.
tags: [cross3, voice, barge_in, dms, m3]

initial_state:
  tenant_id: "senker"
  caller_phone: "+436601234567"      # Max Mustermann (verifiziert)
  did: "+43720273834"                # DID → Tenant senker (resolveTenantByDid)
  cross3_reset: true                 # Buchungs-Wahrheit pro Case sauber lesbar

user:
  goal:
    type: book_appointment
    service: pickerl
  persona: normal
  user_visible:
    redteam_lines:
      - "Guten Tag, ich möchte einen Pickerl-Termin buchen."
      - "Meine Postleitzahl ist 5020."
      # Die Zeilen folgen dem Ablauf, den der Bot am 2026-08-30 wirklich gefahren
      # ist: erkannt an der Rufnummer, Verifikation ueber die PLZ, dann die
      # Ersatzfahrzeug-Frage — die VOR jeder Terminansage beantwortet sein muss
      # (fachliche Vorgabe: Ersatzmobilitaet ist tagesgebunden und knapp).
      # Erst danach sagt er Slots an. GENAU da faellt der Anrufer ihm ins Wort;
      # die Unterbrechung steht deshalb in audio.barge_in, nicht hier — stuende
      # sie hier, spraeche der Anrufer sie ein zweites Mal.
      - "Nein danke, ein Ersatzfahrzeug brauche ich nicht."
      - "Ja, genau der. Bitte verbindlich buchen."
      - "Danke, auf Wiederhören."

audio:
  profile: clean
  sample_rate: 8000                  # CROSS3-Relay spricht SLIN 8 kHz
  barge_in:
    at_turn: 3                       # in die Antwort auf „keine Zusatzservices" —
                                     # das ist die Slot-Ansage. Ohne at_turn traf
                                     # die Unterbrechung immer die BEGRUESSUNG:
                                     # „Nein, warten Sie — lieber am Donnerstag"
                                     # als erster Satz an den Bot, und der Fall
                                     # pruefte etwas, das niemand gemeint hat.
    interrupt_after_ms: 1200         # mitten in der Slot-Ansage
    utterance: "Nein, warten Sie — lieber am Donnerstag. Geht das?"
  barge_in_sla_ms: 300               # Konzept §14: clear-Frame binnen 300 ms

expected:
  forbidden_events:
    - false_success_claim            # keine Terminzusage ohne Werkzeug-Beleg

limits:
  max_turns: 12
  max_duration_seconds: 300
