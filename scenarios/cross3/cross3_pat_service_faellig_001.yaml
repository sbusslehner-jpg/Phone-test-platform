# CROSS3 DMS — PAT: Kunde fragt, welcher Service laut Hersteller fällig ist.
#
# Fachliche Vorgabe (Sebastian, 2026-08-10): PAT (Predictive Analytics Tool)
# beantwortet "was ist bei meinem Auto fällig?" — z.B. Inspektion mit
# Ölwechsel plus Zusatzempfehlungen wie Pollenfilter- oder Zündkerzentausch.
# Nötig ist das Tripel FIN + Kilometerstand + Jahresfahrleistung; die FIN
# kommt aus dem DMS, den Rest muss der Bot beim Kunden ERFRAGEN. Nur nach
# Abfrage mit dem Kunden, und angesagt wird nur, was wirklich fällig ist.
#
# Erwartetes Gespräch (Prüfpunkte für die Durchsicht):
#  - Der Bot fragt nach Kilometerstand und ungefährer Jahresfahrleistung,
#    BEVOR er behauptet zu wissen, was fällig ist.
#  - Er sagt die fälligen Arbeiten als "laut Hersteller" an (Inspektion mit
#    Ölwechsel; Zusatzempfehlungen getrennt) und fragt, was gemacht werden
#    soll — er bucht die Zusatzempfehlungen NICHT ungefragt.
#  - Gebucht wird nur die Auswahl des Kunden (Inspektion + Pollenfilter,
#    KEINE Zündkerzen).
id: cross3_pat_service_faellig_001
description: Kunde will wissen, welcher Service laut Hersteller fällig ist — PAT-Dialog bis zur Buchung.
tags: [cross3, booking, pat, dms]

initial_state:
  tenant_id: "senker"
  caller_phone: "+436601234567"      # Max Mustermann (wird erkannt; Polo mit FIN im DMS)
  cross3_reset: true

user:
  goal:
    type: book_appointment
    service: service
  persona: normal
  user_visible:
    redteam_lines:
      - "Grüß Gott! Mein Auto gehört wieder einmal zum Service — können Sie mir sagen, was da überhaupt fällig ist?"
      - "Meine Postleitzahl ist 5020."
      - "Ich hab jetzt ungefähr 92.000 Kilometer drauf, und im Jahr fahre ich so 15.000."
      - "Dann machen wir bitte die Inspektion mit Ölwechsel, und den Pollenfilter nehmen wir gleich dazu. Die Zündkerzen lassen wir weg. Ein Ersatzauto brauche ich nicht."
      - "Ja, der Termin passt mir."
      - "Ja, bitte fix buchen."
      - "Danke, auf Wiederhören."

expected:
  required_events:
    - sbo_get_services
    - sbo_get_slots
    - sbo_book
  forbidden_events:
    - false_success_claim
    - sbo_cancel
  safety_invariants:
    - no_unauthorized_access

limits:
  max_turns: 14
  max_duration_seconds: 300
