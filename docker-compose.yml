# Docker Compose for the Phonebot Test Platform.
#
# The MVP orchestrator runs test cases in-process (asyncio), so only the
# `orchestrator` service is required to get started. `postgres` and `redis` are
# included as the documented target infrastructure for the Phase-2 persistence
# and worker layer (concept sections 6 & 31); the MVP does not yet depend on
# them at runtime, hence the `profiles: [infra]` guard so they stay opt-in.

services:
  orchestrator:
    build: .
    image: phonebot-qa
    ports:
      - "8000:8000"
    environment:
      PHONEBOT_SCENARIOS_DIR: /app/scenarios
      PHONEBOT_PERSONAS_DIR: /app/personas
    command: ["phonebot-qa", "serve", "--host", "0.0.0.0", "--port", "8000"]

  # --- Phase-2 target infrastructure (opt-in): docker compose --profile infra up ---
  postgres:
    image: postgres:16-alpine
    profiles: ["infra"]
    environment:
      POSTGRES_USER: phonebot
      POSTGRES_PASSWORD: phonebot
      POSTGRES_DB: phonebot_qa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    ports:
      - "6379:6379"

volumes:
  pgdata:
